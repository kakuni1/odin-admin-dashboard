<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>dashboard</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Aldrich&display=swap" rel="stylesheet" />
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div class="container">
            <div class="header"></div>
            <div class="sidebar">
                <div class="group-one">
                    <div id="logo">
                        <object data="images/icons/sidebar/layout-dashboard.svg" width="45" height="45"></object>
                        <h2 id="logo-text">Dashboard</h2>
                    </div>
                    <div id="home">
                        <object data="images/icons/sidebar/home.svg" width="30" height="30"></object>
                        <h3>home</h3>
                    </div>
                    <div id="id">
                        <object data="images/icons/sidebar/id.svg" width="30" height="30"></object>
                        <h3>id</h3>
                    </div>
                    <div id="message">
                        <object data="images/icons/sidebar/message.svg" width="30" height="30"></object>
                        <h3>messages</h3>
                    </div>
                    <div id="history">
                        <object data="images/icons/sidebar/history.svg" width="30" height="30"></object>
                        <h3>history</h3>
                    </div>
                    <div id="tasks">
                        <object data="images/icons/sidebar/layers-subtract.svg" width="30" height="30"></object>
                        <h3>tasks</h3>
                    </div>
                    <div id="community">
                        <object data="images/icons/sidebar/building-community.svg" width="30" height="30"></object>
                        <h3>community</h3>
                    </div>
                </div>
                <div class="group-two">
                    <div id="settings">
                        <object data="images/icons/sidebar/settings.svg" width="30" height="30"></object>
                        <h3>settings</h3>
                    </div>
                    <div id="help">
                        <object data="images/icons/sidebar/help.svg" width="30" height="30"></object>
                        <h3>help</h3>
                    </div>
                    <div id="privacy">
                        <object data="images/icons/sidebar/user-shield.svg" width="30" height="30"></object>
                        <h3>privacy</h3>
                    </div>
                </div>
            </div>
            <div class="main-content">
                <div id="project">
                    <h2>Your Projects</h2>
                </div>
                <div id="announcement">
                    <h2>Announcements</h2>
                </div>
                <div id="trend">
                    <h2>Trending</h2>
                </div>
            </div>
        </div>
    </body>
</html>
